    system_prompt: ""
  - id: opencode
    name: opencode
    runtime: opencode
    role: 代码实现
    system_prompt: ""
  - id: cline
    name: cline
    runtime: cline
    role: UI设计
    system_prompt: ""
  - id: kilo
    name: kilo
    runtime: kilo
    role: 审核
